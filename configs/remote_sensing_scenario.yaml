#time_slot_seconds: 1.0
time_slot_seconds: 30.0
#time_slot_seconds: 60.0 #每一个time slot的时间长度，单位为秒
# -------------------------
# Observation targets
# -------------------------
num_targets: 4
targets:
  - name: agricultural_land_monitoring
    lat_deg: 35.0
    lon_deg: 115.0
    motion_type: fixed
  - name: forest_monitoring
    lat_deg: 45.0
    lon_deg: 100.0
    motion_type: fixed
  - name: maritime_monitoring
    lat_deg: 10.0
    lon_deg: 140.0
    motion_type: fixed
  - name: mobile_user
    lat_deg: 30.0
    lon_deg: 120.0
    motion_type: moving
    speed_mps: 15.0
    heading_deg: 90.0

# -------------------------
# RLS / RS / RSS layer
# Remote sensing satellite layer
# -------------------------
num_rls: 144
rls_total_sats: 144
rls_num_planes: 12
rls_sats_per_plane: 12
rls_altitude_km: 580.0
rls_inclination_deg: 97.7
rls_phase_offset: 1
rls_is_agent: false

# RLS-RLS links are retained as backup/control links,
# but not used by default for observation packet forwarding.
allow_rls_to_rls_edge: true
allow_rls_to_rls_data_flow: false

# -------------------------
# CLS / CS layer
# Communication / relay satellite layer
# -------------------------
num_cls: 30
cls_total_sats: 30
cls_num_planes: 5
cls_sats_per_plane: 6
cls_altitude_km: 1150.0
cls_inclination_deg: 53.0
cls_phase_offset: 1
cls_is_agent: true

# Keep only the best N RLS->CLS access candidates per RLS.
# 0 means unlimited. A modest value keeps CS-layer choices without flooding direct access.
max_access_cls_per_rls: 4

# Require at least this many CLS->CLS relay hops before downlinking to ES.
# This turns the scenario into a CS-layer routing/training case.
min_cls_relay_hops: 1

# -------------------------
# Ground station / ES layer
# -------------------------
num_es: 5
earth_stations:
  - name: ES1
    lat_deg: 40.0
    lon_deg: 116.0
    motion_type: fixed
  - name: ES2
    lat_deg: 31.2
    lon_deg: 121.5
    motion_type: fixed
  - name: ES3
    lat_deg: 43.8
    lon_deg: 87.6
    motion_type: fixed
  - name: ES4
    lat_deg: 1.35
    lon_deg: 103.82
    motion_type: fixed
  - name: ES5
    lat_deg: 13.44
    lon_deg: 144.79
    motion_type: fixed
es_is_agent: false

# -------------------------
# Link constraints
# -------------------------
allow_rls_to_es: false
allow_cls_to_rls: false
allow_es_to_any: false
min_elevation_deg: 10.0

# -------------------------
# RLS observation beam model
# -------------------------
beam:
  enabled: true
  pointing_mode: steerable
  half_angle_deg: 35.0
  max_off_nadir_deg: 65.0
  max_observation_range_km: 5000.0
  gain_max_db: 35.0
  three_db_width_deg: 6.0
  side_lobe_attenuation_db: 25.0
  #max_observation_beams_per_rls: 2 双波束模式，单波束模式设置为1，双波束模式设置为2
  max_observation_beams_per_rls: 2
  max_rls_per_target: 3
  base_observation_delay_ms: 50.0
  base_observation_energy_j: 0.1
  quality_penalty_mode: linear #target到rls的惩罚机制 linear,none
  quality_delay_penalty: 2.0
  quality_energy_penalty: 2.0
  min_quality_for_penalty: 0.2
max_rls_isl_distance_km: 5000.0
max_cls_isl_distance_km: 12000.0
max_cross_layer_distance_km: 7000.0
max_downlink_distance_km: 5000.0

# -------------------------
# RLS access policy
# -------------------------
rls_access_policy: best_quality

# -------------------------
# Packet and queue settings
# -------------------------
packet_count_per_task: 64.0 # compatibility only; multi-source tasks use task_profiles
packet_class: 0 # compatibility only
num_traffic_classes: 3
queue_capacities: [20000, 50000, 100000]
priority_levels: [0, 1, 2]
default_aqm: [0.4, 0.8, 0.1]
background_packets_per_cls: 0.0
background_packet_class: 0
max_concurrent_tasks: 4

# -------------------------
# Multi-source task profiles
# -------------------------
task_profiles:
  - name: urgent
    min_data_mb: 5.0
    max_data_mb: 10.0
    traffic_class: 0
    priority: 0
    deadline_s: 60.0
    probability: 0.2
  - name: normal
    min_data_mb: 20.0
    max_data_mb: 50.0
    traffic_class: 1
    priority: 1
    deadline_s: 180.0
    probability: 0.5
  - name: bulk
    min_data_mb: 80.0
    max_data_mb: 150.0
    traffic_class: 2
    priority: 2
    deadline_s: 600.0
    probability: 0.3

gs_lookahead_slots: 20
drain_slots: 20
gs_selection_weights:
  path_delay: 0.35
  exit_reachability: 0.20
  visibility_window: 0.20
  assigned_load: 0.25
downlink_queue_capacities: [20000, 50000, 100000]
downlink_wpq_weights: [1.0, 1.0, 1.0]

# -------------------------
# Routing cost weights
# -------------------------
routing_weights:
  delay: 0.4
  energy: 0.2
  queue: 0.3
  loss: 0.1

# -------------------------
# Cost normalizers
# -------------------------
normalizer_delay_ms: 150.0
normalizer_energy_j: 10.0
normalizer_queue_packets: 100.0
normalizer_loss: 1.0
reward_cost_clip: 3.0
reward_success_bonus: 1.0
reward_failure_penalty: 1.0
reward_terminal_cls_delay_weight: 1.0
reward_terminal_cls_delay_norm_ms: 30.0
